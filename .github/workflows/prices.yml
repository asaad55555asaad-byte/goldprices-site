name: Update prices
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        env:
          KEY: ${{ secrets.METALCHARTS_KEY }}
        run: |
          curl -fsS --retry 2 -H "Authorization: Bearer $KEY" "https://api.metalcharts.org/v1/prices" > raw.json
          jq -e '.data.XAU.price>0 and .data.XAG.price>0 and .data.XPT.price>0' raw.json >/dev/null
          jq --arg t "$(date -u +%FT%TZ)" '{t:$t,XAU:.data.XAU.price,XAG:.data.XAG.price,XPT:.data.XPT.price,chg:{XAU:.data.XAU.changePercent24h,XAG:.data.XAG.changePercent24h,XPT:.data.XPT.changePercent24h}}' raw.json > prices.json
          rm raw.json
      - name: Fetch news
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, xml.etree.ElementTree as ET, datetime
          def get(q, hl, gl):
              u = "https://news.google.com/rss/search?q=%s&hl=%s&gl=%s&ceid=%s:%s" % (urllib.parse.quote(q), hl, gl, gl, hl[:2])
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read()
              out = []
              for it in ET.fromstring(r).iter("item"):
                  t = (it.findtext("title") or "").strip(); s = (it.findtext("source") or "").strip()
                  if s and t.endswith(" - " + s): t = t[:-len(s)-3]
                  out.append({"title": t, "link": it.findtext("link"), "src": s, "date": it.findtext("pubDate") or ""})
                  if len(out) >= 20: break
              return out
          d = {"t": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "ar": get("الذهب", "ar", "SA"), "en": get("gold price", "en-US", "US")}
          if d["ar"] or d["en"]: json.dump(d, open("news.json", "w"), ensure_ascii=False)
          EOF
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "Update data" && git push)
